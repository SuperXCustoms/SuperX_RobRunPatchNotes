name: SuperX_RobRunPatchNotes

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # every 15 minutes (GitHub can delay this a bit)
  workflow_dispatch:                # "Run workflow" button
    inputs:
      repost_latest:
        description: 'Post the newest patch notes again'
        type: boolean
        default: false
      only_webhook:
        description: 'Post to: all, or one webhook number (1 = Chill Zone, 2 = Goliad Se Grot)'
        type: choice
        options: ['all', '1', '2', '3', '4', '5']
        default: 'all'

permissions:
  contents: write

concurrency:
  group: superx-robrun-patchnotes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Steam and post new patch notes
        run: node run.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          DISCORD_WEBHOOK_URL_3: ${{ secrets.DISCORD_WEBHOOK_URL_3 }}
          DISCORD_WEBHOOK_URL_4: ${{ secrets.DISCORD_WEBHOOK_URL_4 }}
          DISCORD_WEBHOOK_URL_5: ${{ secrets.DISCORD_WEBHOOK_URL_5 }}
          ONLY_WEBHOOK: ${{ inputs.only_webhook || 'all' }}
          ROLE_ID: ${{ vars.ROLE_ID }}
          REPOST_LATEST: ${{ inputs.repost_latest }}

      - name: Save which posts were sent
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "SuperX_RobRunPatchNotes: update state"
            git pull --rebase
            git push
          fi
